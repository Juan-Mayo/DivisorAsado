<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Divisor de Asados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ocultar flechas en los inputs de número para que quede más limpio */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24">
  <div id="root"></div>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const uid = () => Math.random().toString(36).slice(2, 9);
    const currency = (n) => (n || 0).toLocaleString('es-AR', { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
    const STORAGE_KEY = "divisor-asados-v2";

    function App() {
      const [participants, setParticipants] = useState([
        { id: uid(), name: "Rami", eats: true, drinks: true },
        { id: uid(), name: "Matu", eats: true, drinks: true },
        { id: uid(), name: "Alejo", eats: true, drinks: true },
        { id: uid(), name: "Juan",  eats: true, drinks: true },
      ]);
      const [expenses, setExpenses] = useState([]);

      // Cargar datos guardados
      useEffect(() => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (parsed?.participants && parsed?.expenses) {
              setParticipants(parsed.participants);
              setExpenses(parsed.expenses);
            }
          } catch {}
        }
      }, []);

      // Guardar datos automáticamente
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ participants, expenses }));
      }, [participants, expenses]);

      // LÓGICA MATEMÁTICA (Intacta)
      const totalComida = useMemo(() => expenses.filter(e => e.category === "Comida").reduce((s, e) => s + (+e.amount || 0), 0), [expenses]);
      const totalBebida = useMemo(() => expenses.filter(e => e.category === "Bebida").reduce((s, e) => s + (+e.amount || 0), 0), [expenses]);

      const eaters = participants.filter(p => p.eats);
      const drinkers = participants.filter(p => p.drinks);
      const shareComida = eaters.length > 0 ? totalComida / eaters.length : 0;
      const shareBebida = drinkers.length > 0 ? totalBebida / drinkers.length : 0;

      const paidBy = useMemo(() => {
        const acc = Object.fromEntries(participants.map(p => [p.id, 0]));
        for (const e of expenses) acc[e.payerId] = (acc[e.payerId] || 0) + (+e.amount || 0);
        return acc;
      }, [participants, expenses]);

      const owedBy = useMemo(() => {
        const acc = {};
        for (const p of participants) acc[p.id] = (p.eats ? shareComida : 0) + (p.drinks ? shareBebida : 0);
        return acc;
      }, [participants, shareComida, shareBebida]);

      const balanceBy = useMemo(() => {
        const acc = {};
        for (const p of participants) acc[p.id] = (paidBy[p.id] || 0) - (owedBy[p.id] || 0);
        return acc;
      }, [participants, paidBy, owedBy]);

      const transfers = useMemo(() => {
        const debtors = participants.map(p => ({ id: p.id, name: p.name, amt: +(balanceBy[p.id] ?? 0) })).filter(x => x.amt < -0.5).map(x => ({ ...x, amt: -x.amt })).sort((a,b) => b.amt - a.amt);
        const creditors = participants.map(p => ({ id: p.id, name: p.name, amt: +(balanceBy[p.id] ?? 0) })).filter(x => x.amt > 0.5).sort((a,b) => b.amt - a.amt);
        const result = [];
        let i=0, j=0;
        while (i < debtors.length && j < creditors.length) {
          const pay = Math.min(debtors[i].amt, creditors[j].amt);
          result.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(pay) });
          debtors[i].amt -= pay;
          creditors[j].amt -= pay;
          if (debtors[i].amt <= 0.5) i++;
          if (creditors[j].amt <= 0.5) j++;
        }
        return result;
      }, [participants, balanceBy]);

      // ACCIONES
      const addParticipant = () => setParticipants(ps => [...ps, { id: uid(), name: "", eats: true, drinks: true }]);
      const removeParticipant = (id) => { setParticipants(ps => ps.filter(p => p.id !== id)); setExpenses(es => es.filter(e => e.payerId !== id)); };
      const addExpense = () => setExpenses(es => [...es, { id: uid(), item: "", category: "Comida", amount: "", payerId: participants[0]?.id || "" }]);
      const removeExpense = (id) => setExpenses(es => es.filter(e => e.id !== id));
      const resetAll = () => { if (confirm("¿Estás seguro de borrar todos los datos del asado?")) { setExpenses([]); setParticipants([]); localStorage.removeItem(STORAGE_KEY); } };

      return (
        <div className="max-w-lg mx-auto bg-slate-100 min-h-screen relative shadow-2xl">
          
          {/* HEADER FIJO */}
          <header className="bg-orange-600 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center rounded-b-2xl">
            <div>
              <h1 className="text-xl font-extrabold tracking-tight">🔥 Divisor de Asados</h1>
              <p className="text-orange-200 text-sm font-medium">Cuentas claras, conservan la amistad</p>
            </div>
            <button onClick={resetAll} className="p-2 bg-orange-700 hover:bg-orange-800 rounded-full transition" aria-label="Reiniciar">
              <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
          </header>

          <main className="p-4 space-y-8">
            
            {/* SECCIÓN PARTICIPANTES */}
            <section>
              <h2 className="text-lg font-bold text-slate-700 mb-3 ml-1">👥 ¿Quiénes van?</h2>
              <div className="flex flex-col gap-3">
                {participants.map((p, index) => (
                  <div key={p.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3 animate-fade-in">
                    <div className="flex items-center gap-3">
                      <div className="bg-slate-100 text-slate-400 font-bold rounded-full w-8 h-8 flex items-center justify-center text-sm">{index + 1}</div>
                      <input 
                        value={p.name} 
                        onChange={e => setParticipants(ps => ps.map(x => x.id===p.id? {...x, name: e.target.value} : x))} 
                        placeholder="Nombre..." 
                        className="flex-1 bg-transparent text-lg font-semibold focus:outline-none placeholder-slate-400"
                      />
                      <button onClick={() => removeParticipant(p.id)} className="text-red-400 p-2 rounded-full bg-red-50">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                      </button>
                    </div>
                    
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setParticipants(ps => ps.map(x => x.id===p.id? {...x, eats: !x.eats} : x))}
                        className={`flex-1 py-2 px-3 rounded-xl font-medium text-sm transition flex justify-center items-center gap-1 ${p.eats ? 'bg-orange-100 text-orange-700 border-2 border-orange-200' : 'bg-slate-100 text-slate-400 border-2 border-transparent'}`}>
                        🍖 Comió
                      </button>
                      <button 
                        onClick={() => setParticipants(ps => ps.map(x => x.id===p.id? {...x, drinks: !x.drinks} : x))}
                        className={`flex-1 py-2 px-3 rounded-xl font-medium text-sm transition flex justify-center items-center gap-1 ${p.drinks ? 'bg-blue-100 text-blue-700 border-2 border-blue-200' : 'bg-slate-100 text-slate-400 border-2 border-transparent'}`}>
                        🍺 Tomó
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* SECCIÓN GASTOS */}
            <section>
              <h2 className="text-lg font-bold text-slate-700 mb-3 ml-1">🛒 Gastos</h2>
              {expenses.length === 0 ? (
                <div className="bg-slate-200 text-slate-500 rounded-2xl p-6 text-center text-sm font-medium border border-dashed border-slate-300">
                  Todavía no hay gastos anotados.<br/>¡Que alguien vaya a comprar!
                </div>
              ) : (
                <div className="flex flex-col gap-3">
                  {expenses.map(e => (
                    <div key={e.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                      <div className="flex items-center gap-2">
                        <input 
                          value={e.item} 
                          onChange={ev => setExpenses(es => es.map(x => x.id===e.id? {...x, item: ev.target.value} : x))} 
                          placeholder="Ej: Asado, Fernet..." 
                          className="flex-1 bg-slate-50 p-2 rounded-xl text-md font-medium border border-slate-200 focus:outline-none focus:border-orange-400"
                        />
                        <button onClick={() => removeExpense(e.id)} className="text-red-400 p-2 rounded-full bg-red-50">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-2">
                        <select 
                          value={e.payerId} 
                          onChange={ev => setExpenses(es => es.map(x => x.id===e.id? {...x, payerId: ev.target.value} : x))} 
                          className="bg-slate-50 p-2 rounded-xl border border-slate-200 text-sm focus:outline-none">
                          <option value="" disabled>¿Quién pagó?</option>
                          {participants.map(p => <option key={p.id} value={p.id}>{p.name || "Sin nombre"}</option>)}
                        </select>

                        <select 
                          value={e.category} 
                          onChange={ev => setExpenses(es => es.map(x => x.id===e.id? {...x, category: ev.target.value} : x))} 
                          className="bg-slate-50 p-2 rounded-xl border border-slate-200 text-sm focus:outline-none">
                          <option value="Comida">🍖 Comida</option>
                          <option value="Bebida">🍺 Bebida</option>
                        </select>
                      </div>

                      <div className="relative">
                        <span className="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 font-bold">$</span>
                        <input 
                          type="number" 
                          min="0" 
                          value={e.amount} 
                          onChange={ev => setExpenses(es => es.map(x => x.id===e.id? {...x, amount: ev.target.value === '' ? '' : Number(ev.target.value)} : x))} 
                          placeholder="Monto"
                          className="w-full bg-slate-50 pl-8 p-3 rounded-xl border border-slate-200 font-bold text-lg focus:outline-none focus:border-orange-400"
                        />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* SECCIÓN RESUMEN Y TRANSFERENCIAS */}
            <section className="bg-slate-800 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
              <div className="absolute top-0 right-0 w-32 h-32 bg-slate-700 rounded-full opacity-20 -mr-10 -mt-10"></div>
              
              <h2 className="text-xl font-bold mb-4">💰 Resultados</h2>
              
              <div className="flex justify-between items-center bg-slate-700 bg-opacity-50 p-3 rounded-xl mb-2">
                <div className="flex items-center gap-2"><span className="text-xl">🍖</span> <span className="font-medium text-slate-200">Cuota Comida</span></div>
                <div className="font-bold text-lg">{currency(shareComida)}</div>
              </div>
              
              <div className="flex justify-between items-center bg-slate-700 bg-opacity-50 p-3 rounded-xl mb-6">
                <div className="flex items-center gap-2"><span className="text-xl">🍺</span> <span className="font-medium text-slate-200">Cuota Bebida</span></div>
                <div className="font-bold text-lg">{currency(shareBebida)}</div>
              </div>

              <h3 className="text-orange-400 font-bold mb-3 uppercase text-xs tracking-wider">A quién hay que transferirle</h3>
              
              {transfers.length === 0 ? (
                <div className="text-center p-4 bg-slate-700 rounded-xl text-slate-300 font-medium">
                  ¡Todos a mano! Nadie debe nada. 🎉
                </div>
              ) : (
                <ul className="space-y-2">
                  {transfers.map((t, i) => (
                    <li key={i} className="flex flex-col sm:flex-row sm:items-center justify-between bg-white text-slate-800 p-3 rounded-xl shadow-inner gap-2">
                      <div className="flex items-center gap-2 text-sm font-medium">
                        <span className="text-red-500 font-bold truncate max-w-[100px]">{t.from || "Alguien"}</span>
                        <svg className="w-4 h-4 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        <span className="text-emerald-600 font-bold truncate max-w-[100px]">{t.to || "Alguien"}</span>
                      </div>
                      <span className="font-extrabold text-lg text-slate-900 bg-slate-100 px-3 py-1 rounded-lg text-center">
                        {currency(t.amount)}
                      </span>
                    </li>
                  ))}
                </ul>
              )}
            </section>

            <footer className="text-center text-xs text-slate-400 pt-4 pb-8">
              Divisor de Asado hecho con cariño por Juan Mayo
            </footer>
          </main>

          {/* BARRA DE BOTONES FLOTANTE */}
          <div className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 p-4 pb-6 flex gap-3 shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-30">
            <button onClick={addParticipant} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-2 rounded-xl flex justify-center items-center gap-2 transition shadow-sm">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
              Persona
            </button>
            <button onClick={addExpense} className="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-2 rounded-xl flex justify-center items-center gap-2 transition shadow-lg shadow-orange-200">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
              Gasto
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
